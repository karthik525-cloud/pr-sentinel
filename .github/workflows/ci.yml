name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ""
      GITHUB_TOKEN: ""
      GEMINI_FREE_TIER_CONFIRMED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and project
        run: |
          python -m pip install --no-deps -r requirements-build.lock
          python -m pip install --no-deps -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check publication safety
        run: python scripts/check_secrets.py
      - name: Lint and formatting
        run: |
          ruff check app tests benchmarks scripts
          ruff format --check app tests benchmarks scripts
      - name: Offline tests
        run: python -m pytest -q
      - name: Compilation and OpenAPI
        run: |
          python -m compileall -q app tests benchmarks scripts
          python -c "from app.main import app; assert set(app.openapi()['paths']) == {'/health', '/review', '/review/ai'}"
      - name: Build and validate wheel contents
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python scripts/check_wheel.py
